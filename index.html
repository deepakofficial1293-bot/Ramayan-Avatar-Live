<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ramayan Avatar Booth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --navy: #14224a;
      --navy-deep: #0c1530;
      --saffron: #d97706;
      --gold: #eab308;
      --card: #ffffff;
      --border: #ecd9b5;
      --text: #1f2937;
      --muted: #57534e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #fbf3e2 0%, #fdfaf3 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .title-font { font-family: 'Cinzel', Georgia, serif; }
    .container { max-width: 560px; margin: 0 auto; padding: 16px 16px 40px; }
    .header {
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%);
      color: #fde68a;
      padding: 22px 18px;
      border-radius: 16px;
      text-align: center;
      border: 2px solid var(--gold);
      box-shadow: 0 10px 25px rgba(20, 34, 74, 0.18);
      margin-bottom: 18px;
    }
    .header h1 { margin: 0; font-size: 24px; letter-spacing: 0.5px; }
    .header p { margin: 6px 0 0; font-size: 13px; color: #fcd34d; opacity: 0.92; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(180, 120, 40, 0.08);
      margin-bottom: 16px;
    }
    .parchment-box {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      line-height: 1.65;
      font-size: 14px;
    }
    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-secondary {
      padding: 12px 16px;
      background: #1e3a8a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-outline {
      padding: 11px 16px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-success {
      padding: 13px 18px;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .char-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .char-card {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 10px;
      cursor: pointer;
      background: #fff;
      text-align: left;
      transition: all 0.15s ease;
    }
    .char-card.selected {
      border-color: var(--saffron);
      background: #fffbeb;
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.2);
    }
    .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .style-card {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
      text-align: left;
    }
    .style-card.selected { border-color: var(--navy); background: #eff6ff; }
    .upload-zone {
      border: 2px dashed var(--saffron);
      border-radius: 14px;
      padding: 28px 16px;
      background: #fffbeb;
      text-align: center;
      cursor: pointer;
      display: block;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(217, 119, 6, 0.25);
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step-bar { display: flex; justify-content: space-between; margin-bottom: 16px; gap: 6px; }
    .step-pill {
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 4px;
      border-radius: 999px;
      background: #e7e5e4;
      color: #57534e;
    }
    .step-pill.active { background: var(--navy); color: #fde68a; }
    .step-pill.done { background: #fef3c7; color: #92400e; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Putting identity preservation FIRST ensures FLUX Kontext keeps the person's real face and personality.
    const IDENTITY_PREFIX = "Keep the exact face, facial structure, eyes, nose, mouth, beard/facial hair, skin tone, age, and natural likeness of the person in this input photo completely unchanged so friends recognize them immediately. Do NOT beautify, slim, or alter their face. Transform only their attire, ornaments, hair styling, props, and background into an authentic ancient Indian Vedic Ramayana portrait (inspired by classic Indian temple art and Ramanand Sagar / Raja Ravi Varma iconography — strictly NO Persian robes, NO buttoned shirts or tunics, NO European velvet crowns, NO medieval European plate armor).";

    const STYLES = [
      {
        id: 'painting',
        label: 'Traditional Painting',
        subtitle: 'Classic Raja Ravi Varma / Indian devotional painting style',
        suffix: 'Frame as a vertical waist-up portrait with the face clear and well lit. Render as a richly detailed traditional Indian devotional painting in the style of Raja Ravi Varma and classic Hindu calendar art: luminous warm colours, fine gold temple jewelry, soft glowing light, painterly brushwork. Dignified and reverent. No text, borders, or watermarks.'
      },
      {
        id: 'cinematic',
        label: 'Epic Film Still',
        subtitle: 'Photorealistic Indian mythological cinema still',
        suffix: 'Frame as a vertical waist-up portrait with the face clear and well lit. Render as a photorealistic still from a grand Indian mythological epic film: natural golden sunlight, authentic handloom silk textures, antique South Indian temple gold jewelry, shallow depth of field. Dignified and reverent. No text, borders, or watermarks.'
      }
    ];

    const CHARACTERS = [
      {
        id: 'rama',
        name: 'Shri Rama',
        role: 'Prince of Ayodhya',
        desc: 'The seventh avatar of Lord Vishnu and the embodiment of dharma, truth, and noble leadership.',
        lesson: 'Uphold duty (Dharma) and righteousness above all else, even at the cost of personal comfort.',
        scene: 'Portray this exact person as Shri Rama, Prince of Ayodhya: long flowing wavy dark hair below the shoulders, wearing a tall conical tiered ancient Hindu golden crown (Kirita Mukut) studded with rubies and pearls, a sacred white-and-red Vaishnava Urdhva Pundra tilak on the forehead, traditional Indian gold kundal earrings, bare-chested with a sacred thread (janeu) and a royal crimson-and-gold silk angavastra draped gracefully across one shoulder, yellow silk pitambar dhoti, layered antique Indian gold temple necklaces (haar), ornate gold bajuband armlets and kankana wristlets, holding a tall carved golden Indian bow (Kodanda) with a quiver of feathered arrows slung on the back. Setting: carved sandstone temple palace terrace of ancient Ayodhya overlooking the Sarayu river at golden hour.'
      },
      {
        id: 'lakshmana',
        name: 'Lakshmana',
        role: 'Devoted Brother',
        desc: 'Rama’s fiercely loyal younger brother who willingly gave up royal luxury to serve him during 14 years of exile.',
        lesson: 'True love is shown through selfless service, unwavering loyalty, and standing by family in hard times.',
        scene: 'Portray this exact person as Lakshmana, devoted warrior prince of Ayodhya: MUST have long flowing wavy dark hair reaching past the shoulders, wearing a traditional ancient Indian golden royal headband/tiara (or tall slender conical Hindu Kirita Mukut), a sacred vertical tilak on the forehead, gold kundal earrings, bare-chested with a sacred thread (janeu) and a saffron-and-gold silk angavastra draped across the torso, matching silk dhoti, layered Indian gold necklaces (haar), gold bajuband armlets and wristlets, holding a classic curved Indian wooden-and-gold bow with a quiver of arrows on the back. Setting: lush sunlit ancient Indian Dandaka forest with tall banyan trees and golden sunbeams.'
      },
      {
        id: 'sita',
        name: 'Mata Sita',
        role: 'Princess of Mithila',
        desc: 'Incarnation of Goddess Lakshmi, revered for her quiet strength, purity, dignity, and unwavering devotion.',
        lesson: 'Inner strength, grace, and self-respect remain unbroken even in the face of the greatest adversity.',
        scene: 'Portray this exact person as Mata Sita, Queen of Ayodhya: wearing an authentic traditional Indian crimson-and-gold Banarasi silk saree draped gracefully over the shoulder, adorned with classic Indian temple gold jewelry including layered haram necklaces, gold jhumka earrings, stacked gold bangles, ornate bajuband armlets, a delicate gold maang tikka, and a small red bindi on the forehead. Setting: carved stone pavilion and blooming lotus garden of ancient Mithila palace at warm golden hour.'
      },
      {
        id: 'hanuman',
        name: 'Lord Hanuman',
        role: 'Supreme Devotee',
        desc: 'The mighty Vanara warrior whose boundless strength, humility, and courage came from pure devotion to Shri Rama.',
        lesson: 'Selfless devotion and humility unlock limitless courage and strength to overcome any obstacle.',
        scene: 'Portray this exact person as a devout, mighty Indian warrior in the iconography of Lord Hanuman: wearing a tall conical tiered ancient Hindu golden crown (Kirita Mukut), a bright saffron-vermilion sindoor tilak on the forehead, gold kundal earrings, bare-chested with a sacred thread (janeu), rudraksha and heavy gold temple necklaces, a flowing bright saffron silk angavastra and saffron dhoti, ornate gold bajuband armlets and wristlets. Resting on his shoulder is a classic, heavy traditional Indian golden Gada (mace) featuring a long engraved golden handle topped with a large, round, ribbed spherical lotus-bud golden mace head (NOT a trumpet or horn). Setting: dramatic sunlit Himalayan mountain peak at golden sunrise with glowing clouds.'
      },
      {
        id: 'ravan',
        name: 'Ravan (Dashanan)',
        role: 'Mighty King of Lanka',
        desc: 'A brilliant scholar, devout Shiva bhakta, and mighty ten-headed emperor of golden Lanka whose pride led to his downfall.',
        lesson: 'Knowledge and power without humility are dangerous; unchecked ego can destroy even the most learned.',
        scene: 'Portray this exact person as the mighty ten-headed emperor Ravan (Dashanan), King of Golden Lanka: the central main head is this exact person’s face, flanked symmetrically on both sides by nine additional majestic crowned heads (four on the left and five on the right in classic Indian Ramayana Dashanan iconography), each wearing a tall conical tiered Hindu golden crown (Kirita Mukut). On the forehead are three bold horizontal white sacred ash stripes (Shiva Tripundra) with a red tilak. Bare-chested with a heavy royal crimson-and-gold silk angavastra draped over the shoulders, massive layered South Indian gold temple necklaces, rudraksha mala, thick gold bajuband armlets, and holding a gleaming curved royal sword (Chandrahas). Setting: the grand, towering carved golden temple palace hall of ancient Lanka with oil lamps glowing.'
      },
      {
        id: 'kumbkaran',
        name: 'Kumbkaran',
        role: 'Mighty Warrior of Lanka',
        desc: 'Ravan’s giant, courageous brother who advised Ravan against wrongdoing yet fought beside him out of loyalty.',
        lesson: 'Blind loyalty without discernment can pull even a brave and honest soul onto the wrong path.',
        scene: 'Portray this exact person as Kumbkaran, the mighty warrior prince of Lanka: tall conical ancient Hindu bronze-and-gold crown (Kirita Mukut), bold horizontal Shiva Tripundra ash stripes and red tilak on the forehead, long dark hair, heavy gold kundal earrings, bare-chested with a rich dark maroon-and-gold silk angavastra draped over massive shoulders, heavy layered antique Indian gold necklaces, thick gold armlets and wristlets, holding a towering traditional Indian golden trident/spear (Trishul/Shula). Setting: monumental carved ancient Indian stone fortress colonnade of Lanka under a dramatic golden twilight sky.'
      },
      {
        id: 'vibishan',
        name: 'Vibishan',
        role: 'Righteous Prince of Lanka',
        desc: 'Ravan’s youngest brother who stood up for truth, opposed injustice, and chose the side of Shri Rama.',
        lesson: 'Courage means standing up for truth and dharma even when it requires opposing your own circle.',
        scene: 'Portray this exact person as Vibishan, the wise and righteous prince of Lanka: wearing a tall conical tiered ancient Hindu golden crown (Kirita Mukut), a serene white-and-red Vaishnava tilak on the forehead, gold kundal earrings, bare-chested with a sacred thread (janeu) and a pure ivory-white and gold-bordered silk angavastra draped gracefully across the chest, white silk dhoti, refined layered Indian gold temple necklaces, and gold armlets. Setting: a peaceful carved ancient Indian seaside temple terrace in Lanka bathed in warm morning sunlight.'
      },
      {
        id: 'megnath',
        name: 'Megnath (Indrajit)',
        role: 'Conqueror of Indra',
        desc: 'Ravan’s brilliant, unmatched warrior son who mastered celestial weapons and defended Lanka with fierce skill.',
        lesson: 'Extraordinary talent and skill achieve true greatness only when guided by a righteous cause.',
        scene: 'Portray this exact person as Megnath (Indrajit), the charismatic, legendary warrior prince of Lanka: wearing a grand, intricately carved tall conical Hindu golden crown (Kirita Mukut) adorned with gemstones, long dark hair, a bold red-and-ash tilak on the forehead, ornate gold kundal earrings, bare-chested with a royal dark-indigo and gold brocade silk angavastra draped across the chest, richly adorned with heavy layered antique Indian gold necklaces (haar), jeweled gold shoulder ornaments (skandhamala), thick gold bajuband armlets, kankana wristlets, and a jeweled gold kamarbandh waist belt (strictly NO European plate armor). Holding a radiant, intricately carved golden celestial Indian bow with a quiver of golden arrows on his back. Setting: ancient carved golden temple battlements of Lanka with dramatic storm clouds and golden lightning.'
      },
      {
        id: 'bharat',
        name: 'Bharat',
        role: 'Regent of Ayodhya',
        desc: 'Rama’s noble brother who refused to claim the throne, placing Rama’s wooden sandals (Paduka) on it and living as an ascetic.',
        lesson: 'True integrity means refusing what does not rightfully belong to you and honoring duty with humility.',
        scene: 'Portray this exact person as Bharat, the noble ascetic prince of Ayodhya: humble, deeply devoted bearing, wearing a sacred white Vaishnava tilak on the forehead, rudraksha bead necklaces, bare-chested with a sacred thread (janeu) and a simple unstitched ochre-saffron handloom cotton angavastra draped over one shoulder (strictly NO buttoned shirt or tunic), reverently holding Shri Rama’s ornate wooden royal sandals (Paduka) resting on a folded silk cloth in both hands. Setting: a serene ancient Indian forest hermitage (ashram) at Nandigram with warm sunrise light.'
      },
      {
        id: 'sugreev',
        name: 'Sugreev',
        role: 'King of Kishkindha',
        desc: 'The Vanara king who forged a sacred friendship with Shri Rama and mobilized his entire kingdom to find Mata Sita.',
        lesson: 'True friendship is built on mutual trust, gratitude, and honoring the promises we make.',
        scene: 'Portray this exact person as King Sugreev, noble ruler of Kishkindha: wearing a tall conical tiered ancient Hindu golden crown (Kirita Mukut), a bright saffron-and-white tilak on the forehead, gold kundal earrings, bare-chested with a sacred thread (janeu) and a rich emerald-green and gold-bordered silk angavastra draped across the chest (strictly NO buttoned shirt or European cape), green-and-gold silk dhoti, layered antique Indian gold temple necklaces, gold bajuband armlets and wristlets. Setting: sun-drenched ancient rocky hills, waterfalls, and carved temple ruins of Kishkindha in South India.'
      }
    ];

    function App() {
      const [step, setStep] = useState(1);
      const [showAllChars, setShowAllChars] = useState(false);
      const [photoPreview, setPhotoPreview] = useState(null);
      const [base64Photo, setBase64Photo] = useState(null);
      const [selectedChar, setSelectedChar] = useState(CHARACTERS[0]);
      const [selectedStyle, setSelectedStyle] = useState(STYLES[0]);
      const [generatedImage, setGeneratedImage] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [error, setError] = useState(null);

      const handlePhotoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setError(null);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_DIM = 1024;
            let { width, height } = img;

            if (width > height && width > MAX_DIM) {
              height = Math.round((height * MAX_DIM) / width);
              width = MAX_DIM;
            } else if (height >= width && height > MAX_DIM) {
              width = Math.round((width * MAX_DIM) / height);
              height = MAX_DIM;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.88);
            setPhotoPreview(compressedDataUrl);
            setBase64Photo(compressedDataUrl);
            setStep(3);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleGenerate = async () => {
        if (!base64Photo || !selectedChar || !selectedStyle) return;

        setStep(4);
        setIsGenerating(true);
        setError(null);
        setGeneratedImage(null);

        const fullPrompt = `${IDENTITY_PREFIX} ${selectedChar.scene} ${selectedStyle.suffix}`;

        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image_url: base64Photo,
              prompt: fullPrompt
            })
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || `Generation failed (HTTP ${response.status})`);
          }

          setGeneratedImage(data.url);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Could not generate portrait. Please try again.');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleDownload = async () => {
        if (!generatedImage) return;
        const filename = `Ramayan_${selectedChar.id}_${selectedStyle.id}.jpg`;

        try {
          const res = await fetch(generatedImage);
          const blob = await res.blob();
          const blobUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(blobUrl);
        } catch (e) {
          window.open(generatedImage, '_blank');
        }
      };

      return (
        <div className="container">
          <header className="header">
            <h1 className="title-font">Ramayan Avatar Booth</h1>
            <p>Celebrate Dharma, Heritage &amp; the Spirit of Dussehra &amp; Deepavali</p>
          </header>

          <div className="step-bar">
            <div className={`step-pill ${step === 1 ? 'active' : step > 1 ? 'done' : ''}`}>1. Story</div>
            <div className={`step-pill ${step === 2 ? 'active' : step > 2 ? 'done' : ''}`}>2. Photo</div>
            <div className={`step-pill ${step === 3 ? 'active' : step > 3 ? 'done' : ''}`}>3. Avatar</div>
            <div className={`step-pill ${step === 4 ? 'active' : ''}`}>4. Portrait</div>
          </div>

          {step === 1 && (
            <div>
              <div className="card">
                <h2 className="title-font" style={{ marginTop: 0, fontSize: '18px', color: '#14224a' }}>
                  The Timeless Epic of Ramayana
                </h2>
                <div className="parchment-box">
                  The Ramayana is one of the world’s greatest ancient epics, narrating the noble life of Prince Shri Rama of Ayodhya.
                  It is a timeless guide to dharma (duty), compassion, loyalty, and the eternal triumph of good over evil.
                  Honoring his father’s word, Shri Rama willingly accepts a 14-year exile into the forest alongside his devoted wife Sita and loyal brother Lakshmana.
                  During their exile, the arrogant demon king Ravan abducts Sita and takes her to his golden kingdom of Lanka.
                  With the unwavering devotion of Lord Hanuman and the courageous Vanara army led by King Sugreev, Rama crosses the ocean to rescue her.
                  After a fierce battle, Shri Rama vanquishes Ravan, proving that ego and injustice can never prevail over truth.
                  The festival of <strong>Dussehra (Vijayadashami)</strong> celebrates this very victory of righteousness over wickedness.
                  Following the triumph, Shri Rama, Sita, and Lakshmana return home to Ayodhya after fourteen long years.
                  Overjoyed, the citizens illuminate every home and street with rows of glowing clay oil lamps (diyas) to welcome their beloved prince.
                  This joyous homecoming is celebrated across the world as <strong>Deepavali (Diwali)</strong>—the Festival of Lights—reminding us that light always conquers darkness.
                </div>
              </div>

              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h3 className="title-font" style={{ margin: 0, fontSize: '16px', color: '#14224a' }}>
                    Meet the 10 Characters
                  </h3>
                  <button
                    className="btn-outline"
                    style={{ padding: '6px 10px', fontSize: '12px' }}
                    onClick={() => setShowAllChars(!showAllChars)}
                  >
                    {showAllChars ? 'Hide Details' : 'View All 10'}
                  </button>
                </div>

                {showAllChars ? (
                  <div style={{ display: 'grid', gap: '10px', maxHeight: '340px', overflowY: 'auto', paddingRight: '4px' }}>
                    {CHARACTERS.map((c) => (
                      <div key={c.id} style={{ background: '#fafaf9', border: '1px solid #e7e5e4', borderRadius: '10px', padding: '10px 12px', textAlign: 'left' }}>
                        <div style={{ fontWeight: 700, color: '#14224a', fontSize: '14px' }}>
                          {c.name} <span style={{ fontWeight: 500, color: '#b45309', fontSize: '12px' }}>• {c.role}</span>
                        </div>
                        <p style={{ margin: '4px 0', fontSize: '13px', color: '#44403c' }}>{c.desc}</p>
                        <p style={{ margin: 0, fontSize: '12px', color: '#92400e', fontStyle: 'italic' }}>
                          <strong>Life Lesson:</strong> {c.lesson}
                        </p>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p style={{ margin: 0, fontSize: '13px', color: '#57534e' }}>
                    Rama, Lakshmana, Sita, Hanuman, Ravan, Kumbkaran, Vibishan, Megnath, Bharat &amp; Sugreev — tap "View All 10" or proceed to pick your character.
                  </p>
                )}
              </div>

              <button className="btn-primary" onClick={() => setStep(2)}>
                Create Your Ramayan Portrait →
              </button>
            </div>
          )}

          {step === 2 && (
            <div className="card" style={{ textAlign: 'center' }}>
              <h2 className="title-font" style={{ marginTop: 0, color: '#14224a' }}>Upload or Take a Selfie</h2>
              <p style={{ fontSize: '14px', color: '#57534e', marginBottom: '18px' }}>
                Use a clear, front-facing photo in good lighting so the portrait looks unmistakably like you.
              </p>

              <label className="upload-zone">
                <div style={{ fontSize: '34px', marginBottom: '8px' }}>📸</div>
                <div style={{ fontWeight: 700, color: '#92400e', fontSize: '16px' }}>Tap to Choose Photo or Open Camera</div>
                <div style={{ fontSize: '12px', color: '#78716c', marginTop: '6px' }}>
                  Automatically optimized for fast generation
                </div>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handlePhotoUpload}
                  style={{ display: 'none' }}
                />
              </label>

              <div style={{ marginTop: '18px' }}>
                <button className="btn-outline" onClick={() => setStep(1)}>← Back to Story</button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <div className="card" style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                {photoPreview && (
                  <img
                    src={photoPreview}
                    alt="Your photo"
                    style={{ width: '64px', height: '64px', borderRadius: '50%', objectFit: 'cover', border: '2px solid #d97706' }}
                  />
                )}
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: '14px', color: '#14224a' }}>Photo Ready</div>
                  <div style={{ fontSize: '12px', color: '#57534e' }}>Select your character and portrait style below</div>
                </div>
                <button className="btn-outline" style={{ padding: '7px 10px', fontSize: '12px' }} onClick={() => setStep(2)}>
                  Change
                </button>
              </div>

              <div className="card">
                <h3 className="title-font" style={{ margin: '0 0 10px', fontSize: '16px', color: '#14224a' }}>
                  1. Choose Character
                </h3>
                <div className="char-grid">
                  {CHARACTERS.map((c) => {
                    const isSel = selectedChar.id === c.id;
                    return (
                      <div
                        key={c.id}
                        className={`char-card ${isSel ? 'selected' : ''}`}
                        onClick={() => setSelectedChar(c)}
                      >
                        <div style={{ fontWeight: 700, fontSize: '14px', color: '#14224a' }}>{c.name}</div>
                        <div style={{ fontSize: '11px', color: '#b45309', marginTop: '2px' }}>{c.role}</div>
                      </div>
                    );
                  })}
                </div>

                {selectedChar && (
                  <div className="parchment-box" style={{ marginTop: '14px', padding: '12px 14px' }}>
                    <div style={{ fontWeight: 700, color: '#14224a', marginBottom: '4px' }}>
                      {selectedChar.name} — {selectedChar.role}
                    </div>
                    <div style={{ fontSize: '13px', marginBottom: '6px' }}>{selectedChar.desc}</div>
                    <div style={{ fontSize: '12px', color: '#92400e', fontStyle: 'italic' }}>
                      <strong>Life Lesson:</strong> {selectedChar.lesson}
                    </div>
                  </div>
                )}
              </div>

              <div className="card">
                <h3 className="title-font" style={{ margin: '0 0 6px', fontSize: '16px', color: '#14224a' }}>
                  2. Choose Art Style
                </h3>
                <div className="style-grid">
                  {STYLES.map((s) => {
                    const isSel = selectedStyle.id === s.id;
                    return (
                      <div
                        key={s.id}
                        className={`style-card ${isSel ? 'selected' : ''}`}
                        onClick={() => setSelectedStyle(s)}
                      >
                        <div style={{ fontWeight: 700, fontSize: '13px', color: '#14224a' }}>{s.label}</div>
                        <div style={{ fontSize: '11px', color: '#57534e', marginTop: '4px', lineHeight: 1.4 }}>{s.subtitle}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <button className="btn-primary" onClick={handleGenerate}>
                ✨ Generate {selectedChar.name} Portrait
              </button>
            </div>
          )}

          {step === 4 && (
            <div className="card" style={{ textAlign: 'center' }}>
              <h2 className="title-font" style={{ marginTop: 0, color: '#14224a', fontSize: '20px' }}>
                {selectedChar.name}
              </h2>
              <div style={{ fontSize: '12px', color: '#b45309', marginTop: '-10px', marginBottom: '14px', fontWeight: 600 }}>
                {selectedStyle.label}
              </div>

              <div style={{
                width: '100%',
                maxWidth: '340px',
                aspectRatio: '3 / 4',
                margin: '0 auto 16px',
                borderRadius: '14px',
                overflow: 'hidden',
                border: '3px solid #d97706',
                background: '#f5f5f4',
                position: 'relative',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center'
              }}>
                {isGenerating ? (
                  <>
                    {photoPreview && (
                      <img
                        src={photoPreview}
                        alt="Processing"
                        style={{ width: '100%', height: '100%', objectFit: 'cover', opacity: 0.25, filter: 'blur(5px)' }}
                      />
                    )}
                    <div style={{ position: 'absolute', padding: '16px' }}>
                      <div className="spinner"></div>
                      <div style={{ fontWeight: 700, color: '#14224a', fontSize: '15px' }}>Crafting Your Portrait...</div>
                      <div style={{ fontSize: '12px', color: '#57534e', marginTop: '4px' }}>Usually takes 8–15 seconds</div>
                    </div>
                  </>
                ) : error ? (
                  <div style={{ padding: '20px', color: '#b91c1c', fontSize: '14px' }}>
                    <strong>Something went wrong</strong>
                    <p style={{ marginTop: '8px', fontSize: '13px' }}>{error}</p>
                  </div>
                ) : generatedImage ? (
                  <img
                    src={generatedImage}
                    alt={`${selectedChar.name} portrait`}
                    style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                  />
                ) : null}
              </div>

              <div className="parchment-box" style={{ marginBottom: '18px' }}>
                <p style={{ margin: '0 0 6px', fontSize: '13px' }}>
                  <strong>About {selectedChar.name}:</strong> {selectedChar.desc}
                </p>
                <p style={{ margin: 0, fontSize: '13px', color: '#92400e', fontStyle: 'italic' }}>
                  <strong>Life Lesson:</strong> "{selectedChar.lesson}"
                </p>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {!isGenerating && generatedImage && (
                  <button className="btn-success" onClick={handleDownload}>
                    ⬇ Save / Download Portrait
                  </button>
                )}

                {!isGenerating && error && (
                  <button className="btn-primary" onClick={handleGenerate}>
                    Retry Generation
                  </button>
                )}

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                  <button className="btn-secondary" onClick={() => setStep(3)} disabled={isGenerating}>
                    Change Avatar / Style
                  </button>
                  <button
                    className="btn-outline"
                    disabled={isGenerating}
                    onClick={() => {
                      setStep(1);
                      setPhotoPreview(null);
                      setBase64Photo(null);
                      setGeneratedImage(null);
                      setError(null);
                    }}
                  >
                    Start Over
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
