<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ramayan Avatar Booth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --navy: #14224a;
      --navy-deep: #0c1530;
      --saffron: #d97706;
      --saffron-light: #f59e0b;
      --gold: #eab308;
      --parchment: #fdf8ee;
      --card: #ffffff;
      --border: #ecd9b5;
      --text: #1f2937;
      --muted: #57534e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg, #fbf3e2 0%, #fdfaf3 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .title-font { font-family: 'Cinzel', Georgia, serif; }
    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px 40px;
    }
    .header {
      background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 100%);
      color: #fde68a;
      padding: 22px 18px;
      border-radius: 16px;
      text-align: center;
      border: 2px solid var(--gold);
      box-shadow: 0 10px 25px rgba(20, 34, 74, 0.18);
      margin-bottom: 18px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.5px;
    }
    .header p {
      margin: 6px 0 0;
      font-size: 13px;
      color: #fcd34d;
      opacity: 0.92;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 14px rgba(180, 120, 40, 0.08);
      margin-bottom: 16px;
    }
    .parchment-box {
      background: #fffbeb;
      border: 1px solid #fcd34d;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      line-height: 1.65;
      font-size: 14px;
    }
    .btn-primary {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .btn-secondary {
      padding: 12px 16px;
      background: #1e3a8a;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-outline {
      padding: 11px 16px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-success {
      padding: 13px 18px;
      background: #059669;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .char-card {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 10px;
      cursor: pointer;
      background: #fff;
      text-align: left;
      transition: all 0.15s ease;
    }
    .char-card.selected {
      border-color: var(--saffron);
      background: #fffbeb;
      box-shadow: 0 0 0 2px rgba(217, 119, 6, 0.2);
    }
    .style-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .style-card {
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      background: #fff;
      text-align: left;
    }
    .style-card.selected {
      border-color: var(--navy);
      background: #eff6ff;
    }
    .upload-zone {
      border: 2px dashed var(--saffron);
      border-radius: 14px;
      padding: 28px 16px;
      background: #fffbeb;
      text-align: center;
      cursor: pointer;
      display: block;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(217, 119, 6, 0.25);
      border-top-color: #d97706;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .step-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 6px;
    }
    .step-pill {
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 4px;
      border-radius: 999px;
      background: #e7e5e4;
      color: #57534e;
    }
    .step-pill.active {
      background: var(--navy);
      color: #fde68a;
    }
    .step-pill.done {
      background: #fef3c7;
      color: #92400e;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const STYLES = [
      {
        id: 'painting',
        label: 'Traditional Painting',
        subtitle: 'Devotional Indian artwork with luminous colour & brushwork',
        suffix: 'Render it as a richly detailed traditional Indian devotional painting: luminous colour, fine ornament, soft glowing light, painterly brushwork. Dignified and reverent in tone. No text, captions, borders or watermarks in the image.'
      },
      {
        id: 'cinematic',
        label: 'Epic Film Still',
        subtitle: 'Photorealistic still with natural light & real textures',
        suffix: 'Render it as a photorealistic still from a grand mythological epic film: dramatic natural light, real fabric and metal textures, shallow depth of field. Dignified and reverent in tone. No text, captions, borders or watermarks in the image.'
      }
    ];

    const IDENTITY_CLAUSE = "Most important: keep this person's own face, identity, skin tone, age and gender exactly as in the photo, so friends recognise them at once. Change only clothing, ornaments, hair styling, pose and setting. Frame it as a vertical waist-up portrait with the face clear and well lit.";

    const CHARACTERS = [
      {
        id: 'rama',
        name: 'Shri Rama',
        role: 'Prince of Ayodhya',
        desc: 'The seventh avatar of Lord Vishnu and the embodiment of dharma, truth, and noble leadership.',
        lesson: 'Uphold duty (Dharma) and righteousness above all else, even at the cost of personal comfort.',
        scene: 'Edit this photo into a respectful portrait of the same person as Shri Ram, prince of Ayodhya: a serene, noble bearing, a tall golden crown (mukut), a yellow silk dhoti (pitambar) with a draped crimson and gold angavastra, gold armlets and necklaces, a tilak on the forehead, holding a great bow (Kodanda) with a quiver of arrows on the back. Setting: the palace terraces of Ayodhya at golden hour.'
      },
      {
        id: 'lakshmana',
        name: 'Lakshmana',
        role: 'Devoted Brother',
        desc: 'Rama’s fiercely loyal younger brother who willingly gave up royal luxury to serve him during 14 years of exile.',
        lesson: 'True love is shown through selfless service, unwavering loyalty, and standing by family in hard times.',
        scene: 'Edit this photo into a respectful portrait of the same person as Lakshmana, warrior prince of Ayodhya: a determined and devoted bearing, royal warrior attire in saffron and gold silk, ornate gold armlets, necklaces, a smaller golden crown, a tilak on the forehead, holding a great bow with a quiver of arrows on the back. Setting: sunlit Dandaka forest with warm golden rays through ancient trees.'
      },
      {
        id: 'sita',
        name: 'Mata Sita',
        role: 'Princess of Mithila',
        desc: 'Incarnation of Goddess Lakshmi, revered for her quiet strength, purity, dignity, and unwavering devotion.',
        lesson: 'Inner strength, grace, and self-respect remain unbroken even in the face of the greatest adversity.',
        scene: 'Edit this photo into a respectful portrait of the same person as Mata Sita, queen of Ayodhya: a serene and graceful bearing, wearing an exquisite traditional red and gold silk saree with fine zari border, classical Indian gold necklaces, jhumka earrings, bangles, and a delicate maang tikka. Setting: a lush palace garden in Mithila with blooming lotus ponds at golden hour.'
      },
      {
        id: 'hanuman',
        name: 'Lord Hanuman',
        role: 'Supreme Devotee',
        desc: 'The mighty Vanara warrior whose boundless strength, humility, and courage came from pure devotion to Shri Rama.',
        lesson: 'Selfless devotion and humility unlock limitless courage and strength to overcome any obstacle.',
        scene: 'Edit this photo into a respectful portrait of the same person as a noble warrior devotee inspired by Lord Hanuman: heroic and devout bearing, saffron silk dhoti and draped angavastra, heavy gold necklaces, armlets, a golden crown, a saffron tilak on the forehead, resting a gleaming ornate golden gada (mace) over the shoulder. Setting: a dramatic sunlit mountain peak overlooking the ocean at sunrise.'
      },
      {
        id: 'ravan',
        name: 'Ravan',
        role: 'King of Lanka',
        desc: 'A brilliant scholar, devout Shiva bhakta, and mighty emperor of golden Lanka whose pride led to his downfall.',
        lesson: 'Knowledge and power without humility are dangerous; unchecked ego can destroy even the most learned.',
        scene: 'Edit this photo into a respectful, commanding portrait of the same person as Ravan, the scholar-king of golden Lanka: proud, intense royal bearing, opulent dark crimson and black silk royal robes with rich gold embroidery, heavy gold necklaces and armlets, a tall ornate golden crown, and three horizontal sacred ash stripes (tripundra) with a red tilak on the forehead. Setting: the grand golden palace balcony of Lanka at dusk.'
      },
      {
        id: 'kumbkaran',
        name: 'Kumbkaran',
        role: 'Mighty Warrior of Lanka',
        desc: 'Ravan’s giant, courageous brother who advised Ravan against wrongdoing yet fought beside him out of loyalty.',
        lesson: 'Blind loyalty without discernment can pull even a brave and honest soul onto the wrong path.',
        scene: 'Edit this photo into a respectful portrait of the same person as Kumbkaran, the mighty warrior prince of Lanka: powerful, imposing heroic bearing, heavy ornate bronze-and-gold royal battle armor over dark silk robes, grand golden crown, thick gold armlets, holding a massive royal spear. Setting: the grand stone colonnade of Lanka’s fortress under a dramatic twilight sky.'
      },
      {
        id: 'vibishan',
        name: 'Vibishan',
        role: 'Righteous Prince of Lanka',
        desc: 'Ravan’s youngest brother who stood up for truth, opposed injustice, and chose the side of Shri Rama.',
        lesson: 'Courage means standing up for truth and dharma even when it requires opposing your own circle.',
        scene: 'Edit this photo into a respectful portrait of the same person as Vibishan, the righteous prince of Lanka: calm, wise, and dignified bearing, wearing refined ivory-white and gold silk royal robes, tasteful gold necklaces, armlets, a royal golden crown, and a serene tilak on the forehead. Setting: a peaceful seaside temple terrace in Lanka bathed in warm morning light.'
      },
      {
        id: 'megnath',
        name: 'Megnath (Indrajit)',
        role: 'Conqueror of Indra',
        desc: 'Ravan’s brilliant, unmatched warrior son who mastered celestial weapons and defended Lanka with fierce skill.',
        lesson: 'Extraordinary talent and skill achieve true greatness only when guided by a righteous cause.',
        scene: 'Edit this photo into a respectful portrait of the same person as Megnath (Indrajit), the legendary warrior prince of Lanka: confident, fierce bearing, ornate dark navy and gold celestial battle armor, an intricate golden warrior crown, gold armlets, holding a glowing carved bow with arrows on his back. Setting: dramatic storm-lit palace battlements with golden lightning on the horizon.'
      },
      {
        id: 'bharat',
        name: 'Bharat',
        role: 'Regent of Ayodhya',
        desc: 'Rama’s noble brother who refused to claim the throne, placing Rama’s wooden sandals (Paduka) on it and living as an ascetic.',
        lesson: 'True integrity means refusing what does not rightfully belong to you and honoring duty with humility.',
        scene: 'Edit this photo into a respectful portrait of the same person as Bharat, the noble ascetic prince of Ayodhya: humble, deeply devoted bearing, wearing simple ochre-saffron ascetic silk robes (valkala), a sacred tilak on the forehead, rudraksha beads, reverently holding ornate royal wooden sandals (Paduka) wrapped in silk. Setting: the serene hermitage of Nandigram at soft golden sunrise.'
      },
      {
        id: 'sugreev',
        name: 'Sugreev',
        role: 'King of Kishkindha',
        desc: 'The Vanara king who forged a sacred friendship with Shri Rama and mobilized his entire kingdom to find Mata Sita.',
        lesson: 'True friendship is built on mutual trust, gratitude, and honoring the promises we make.',
        scene: 'Edit this photo into a respectful portrait of the same person as King Sugreev of Kishkindha: noble, determined royal warrior bearing, rich forest-green and gold silk royal attire, a prominent ornate golden crown, layered gold necklaces and armlets, and a warrior tilak on the forehead. Setting: the sun-drenched ancient rocky hills and waterfalls of Kishkindha.'
      }
    ];

    function App() {
      const [step, setStep] = useState(1);
      const [showAllChars, setShowAllChars] = useState(false);
      const [photoPreview, setPhotoPreview] = useState(null);
      const [base64Photo, setBase64Photo] = useState(null);
      const [selectedChar, setSelectedChar] = useState(CHARACTERS[0]);
      const [selectedStyle, setSelectedStyle] = useState(STYLES[0]);
      const [generatedImage, setGeneratedImage] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [error, setError] = useState(null);

      const handlePhotoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        setError(null);
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const MAX_DIM = 1024;
            let { width, height } = img;

            if (width > height && width > MAX_DIM) {
              height = Math.round((height * MAX_DIM) / width);
              width = MAX_DIM;
            } else if (height >= width && height > MAX_DIM) {
              width = Math.round((width * MAX_DIM) / height);
              height = MAX_DIM;
            }

            canvas.width = width;
            canvas.height = height;
            ctx.drawImage(img, 0, 0, width, height);

            const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            setPhotoPreview(compressedDataUrl);
            setBase64Photo(compressedDataUrl);
            setStep(3);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleGenerate = async () => {
        if (!base64Photo || !selectedChar || !selectedStyle) return;

        setStep(4);
        setIsGenerating(true);
        setError(null);
        setGeneratedImage(null);

        const fullPrompt = `${selectedChar.scene} ${IDENTITY_CLAUSE} ${selectedStyle.suffix}`;

        try {
          const response = await fetch('/api/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image_url: base64Photo,
              prompt: fullPrompt
            })
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(data.error || `Generation failed (HTTP ${response.status})`);
          }

          setGeneratedImage(data.url);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Could not generate portrait. Please try again.');
        } finally {
          setIsGenerating(false);
        }
      };

      const handleDownload = async () => {
        if (!generatedImage) return;
        const filename = `Ramayan_${selectedChar.id}_${selectedStyle.id}.jpg`;

        try {
          const res = await fetch(generatedImage);
          const blob = await res.blob();
          const blobUrl = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = blobUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(blobUrl);
        } catch (e) {
          // Fallback for strict mobile browsers (e.g. iOS Safari)
          window.open(generatedImage, '_blank');
        }
      };

      return (
        <div className="container">
          <header className="header">
            <h1 className="title-font">Ramayan Avatar Booth</h1>
            <p>Celebrate Dharma, Heritage &amp; the Spirit of Dussehra &amp; Deepavali</p>
          </header>

          <div className="step-bar">
            <div className={`step-pill ${step === 1 ? 'active' : step > 1 ? 'done' : ''}`}>1. Story</div>
            <div className={`step-pill ${step === 2 ? 'active' : step > 2 ? 'done' : ''}`}>2. Photo</div>
            <div className={`step-pill ${step === 3 ? 'active' : step > 3 ? 'done' : ''}`}>3. Avatar</div>
            <div className={`step-pill ${step === 4 ? 'active' : ''}`}>4. Portrait</div>
          </div>

          {step === 1 && (
            <div>
              <div className="card">
                <h2 className="title-font" style={{ marginTop: 0, fontSize: '18px', color: '#14224a' }}>
                  The Timeless Epic of Ramayana
                </h2>
                <div className="parchment-box">
                  The Ramayana is one of the world’s greatest ancient epics, narrating the noble life of Prince Shri Rama of Ayodhya.
                  It is a timeless guide to dharma (duty), compassion, loyalty, and the eternal triumph of good over evil.
                  Honoring his father’s word, Shri Rama willingly accepts a 14-year exile into the forest alongside his devoted wife Sita and loyal brother Lakshmana.
                  During their exile, the arrogant demon king Ravan abducts Sita and takes her to his golden kingdom of Lanka.
                  With the unwavering devotion of Lord Hanuman and the courageous Vanara army led by King Sugreev, Rama crosses the ocean to rescue her.
                  After a fierce battle, Shri Rama vanquishes Ravan, proving that ego and injustice can never prevail over truth.
                  The festival of <strong>Dussehra (Vijayadashami)</strong> celebrates this very victory of righteousness over wickedness.
                  Following the triumph, Shri Rama, Sita, and Lakshmana return home to Ayodhya after fourteen long years.
                  Overjoyed, the citizens illuminate every home and street with rows of glowing clay oil lamps (diyas) to welcome their beloved prince.
                  This joyous homecoming is celebrated across the world as <strong>Deepavali (Diwali)</strong>—the Festival of Lights—reminding us that light always conquers darkness.
                </div>
              </div>

              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <h3 className="title-font" style={{ margin: 0, fontSize: '16px', color: '#14224a' }}>
                    Meet the 10 Characters
                  </h3>
                  <button
                    className="btn-outline"
                    style={{ padding: '6px 10px', fontSize: '12px' }}
                    onClick={() => setShowAllChars(!showAllChars)}
                  >
                    {showAllChars ? 'Hide Details' : 'View All 10'}
                  </button>
                </div>

                {showAllChars ? (
                  <div style={{ display: 'grid', gap: '10px', maxHeight: '340px', overflowY: 'auto', paddingRight: '4px' }}>
                    {CHARACTERS.map((c) => (
                      <div key={c.id} style={{ background: '#fafaf9', border: '1px solid #e7e5e4', borderRadius: '10px', padding: '10px 12px', textAlign: 'left' }}>
                        <div style={{ fontWeight: 700, color: '#14224a', fontSize: '14px' }}>
                          {c.name} <span style={{ fontWeight: 500, color: '#b45309', fontSize: '12px' }}>• {c.role}</span>
                        </div>
                        <p style={{ margin: '4px 0', fontSize: '13px', color: '#44403c' }}>{c.desc}</p>
                        <p style={{ margin: 0, fontSize: '12px', color: '#92400e', fontStyle: 'italic' }}>
                          <strong>Life Lesson:</strong> {c.lesson}
                        </p>
                      </div>
                    ))}
                  </div>
                ) : (
                  <p style={{ margin: 0, fontSize: '13px', color: '#57534e' }}>
                    Rama, Lakshmana, Sita, Hanuman, Ravan, Kumbkaran, Vibishan, Megnath, Bharat &amp; Sugreev — tap "View All 10" or proceed to pick your character.
                  </p>
                )}
              </div>

              <button className="btn-primary" onClick={() => setStep(2)}>
                Create Your Ramayan Portrait →
              </button>
            </div>
          )}

          {step === 2 && (
            <div className="card" style={{ textAlign: 'center' }}>
              <h2 className="title-font" style={{ marginTop: 0, color: '#14224a' }}>Upload or Take a Selfie</h2>
              <p style={{ fontSize: '14px', color: '#57534e', marginBottom: '18px' }}>
                Use a clear, front-facing photo in good lighting so the portrait looks unmistakably like you.
              </p>

              <label className="upload-zone">
                <div style={{ fontSize: '34px', marginBottom: '8px' }}>📸</div>
                <div style={{ fontWeight: 700, color: '#92400e', fontSize: '16px' }}>Tap to Choose Photo or Open Camera</div>
                <div style={{ fontSize: '12px', color: '#78716c', marginTop: '6px' }}>
                  Automatically optimized for fast generation
                </div>
                <input
                  type="file"
                  accept="image/*"
                  onChange={handlePhotoUpload}
                  style={{ display: 'none' }}
                />
              </label>

              <div style={{ marginTop: '18px' }}>
                <button className="btn-outline" onClick={() => setStep(1)}>← Back to Story</button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <div className="card" style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                {photoPreview && (
                  <img
                    src={photoPreview}
                    alt="Your photo"
                    style={{ width: '64px', height: '64px', borderRadius: '50%', objectFit: 'cover', border: '2px solid #d97706' }}
                  />
                )}
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: '14px', color: '#14224a' }}>Photo Ready</div>
                  <div style={{ fontSize: '12px', color: '#57534e' }}>Select your character and portrait style below</div>
                </div>
                <button className="btn-outline" style={{ padding: '7px 10px', fontSize: '12px' }} onClick={() => setStep(2)}>
                  Change
                </button>
              </div>

              <div className="card">
                <h3 className="title-font" style={{ margin: '0 0 10px', fontSize: '16px', color: '#14224a' }}>
                  1. Choose Character
                </h3>
                <div className="char-grid">
                  {CHARACTERS.map((c) => {
                    const isSel = selectedChar.id === c.id;
                    return (
                      <div
                        key={c.id}
                        className={`char-card ${isSel ? 'selected' : ''}`}
                        onClick={() => setSelectedChar(c)}
                      >
                        <div style={{ fontWeight: 700, fontSize: '14px', color: '#14224a' }}>{c.name}</div>
                        <div style={{ fontSize: '11px', color: '#b45309', marginTop: '2px' }}>{c.role}</div>
                      </div>
                    );
                  })}
                </div>

                {selectedChar && (
                  <div className="parchment-box" style={{ marginTop: '14px', padding: '12px 14px' }}>
                    <div style={{ fontWeight: 700, color: '#14224a', marginBottom: '4px' }}>
                      {selectedChar.name} — {selectedChar.role}
                    </div>
                    <div style={{ fontSize: '13px', marginBottom: '6px' }}>{selectedChar.desc}</div>
                    <div style={{ fontSize: '12px', color: '#92400e', fontStyle: 'italic' }}>
                      <strong>Life Lesson:</strong> {selectedChar.lesson}
                    </div>
                  </div>
                )}
              </div>

              <div className="card">
                <h3 className="title-font" style={{ margin: '0 0 6px', fontSize: '16px', color: '#14224a' }}>
                  2. Choose Art Style
                </h3>
                <div className="style-grid">
                  {STYLES.map((s) => {
                    const isSel = selectedStyle.id === s.id;
                    return (
                      <div
                        key={s.id}
                        className={`style-card ${isSel ? 'selected' : ''}`}
                        onClick={() => setSelectedStyle(s)}
                      >
                        <div style={{ fontWeight: 700, fontSize: '13px', color: '#14224a' }}>{s.label}</div>
                        <div style={{ fontSize: '11px', color: '#57534e', marginTop: '4px', lineHeight: 1.4 }}>{s.subtitle}</div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <button className="btn-primary" onClick={handleGenerate}>
                ✨ Generate {selectedChar.name} Portrait
              </button>
            </div>
          )}

          {step === 4 && (
            <div className="card" style={{ textAlign: 'center' }}>
              <h2 className="title-font" style={{ marginTop: 0, color: '#14224a', fontSize: '20px' }}>
                {selectedChar.name}
              </h2>
              <div style={{ fontSize: '12px', color: '#b45309', marginTop: '-10px', marginBottom: '14px', fontWeight: 600 }}>
                {selectedStyle.label}
              </div>

              <div style={{
                width: '100%',
                maxWidth: '340px',
                aspectRatio: '3 / 4',
                margin: '0 auto 16px',
                borderRadius: '14px',
                overflow: 'hidden',
                border: '3px solid #d97706',
                background: '#f5f5f4',
                position: 'relative',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center'
              }}>
                {isGenerating ? (
                  <>
                    {photoPreview && (
                      <img
                        src={photoPreview}
                        alt="Processing"
                        style={{ width: '100%', height: '100%', objectFit: 'cover', opacity: 0.25, filter: 'blur(5px)' }}
                      />
                    )}
                    <div style={{ position: 'absolute', padding: '16px' }}>
                      <div className="spinner"></div>
                      <div style={{ fontWeight: 700, color: '#14224a', fontSize: '15px' }}>Crafting Your Portrait...</div>
                      <div style={{ fontSize: '12px', color: '#57534e', marginTop: '4px' }}>Usually takes 8–15 seconds</div>
                    </div>
                  </>
                ) : error ? (
                  <div style={{ padding: '20px', color: '#b91c1c', fontSize: '14px' }}>
                    <strong>Something went wrong</strong>
                    <p style={{ marginTop: '8px', fontSize: '13px' }}>{error}</p>
                  </div>
                ) : generatedImage ? (
                  <img
                    src={generatedImage}
                    alt={`${selectedChar.name} portrait`}
                    style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                  />
                ) : null}
              </div>

              <div className="parchment-box" style={{ marginBottom: '18px' }}>
                <p style={{ margin: '0 0 6px', fontSize: '13px' }}>
                  <strong>About {selectedChar.name}:</strong> {selectedChar.desc}
                </p>
                <p style={{ margin: 0, fontSize: '13px', color: '#92400e', fontStyle: 'italic' }}>
                  <strong>Life Lesson:</strong> "{selectedChar.lesson}"
                </p>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                {!isGenerating && generatedImage && (
                  <button className="btn-success" onClick={handleDownload}>
                    ⬇ Save / Download Portrait
                  </button>
                )}

                {!isGenerating && error && (
                  <button className="btn-primary" onClick={handleGenerate}>
                    Retry Generation
                  </button>
                )}

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                  <button className="btn-secondary" onClick={() => setStep(3)} disabled={isGenerating}>
                    Change Avatar / Style
                  </button>
                  <button
                    className="btn-outline"
                    disabled={isGenerating}
                    onClick={() => {
                      setStep(1);
                      setPhotoPreview(null);
                      setBase64Photo(null);
                      setGeneratedImage(null);
                      setError(null);
                    }}
                  >
                    Start Over
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
